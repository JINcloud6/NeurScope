[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurscope"
version = "0.1.0"
description = "Controlled Neuroglancer observations for neuron proofreading agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pillow>=10", "pydantic>=2.11,<3",
  "neuroglancer>=2.41,<3", "mcp>=1.30,<2", "playwright>=1.50,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
prepare = ["caveclient>=5", "cloud-volume>=11"]

[project.scripts]
neurscope-tools = "benchmark.observation_server:main"
neurscope-prepare = "benchmark.proofreading:main"
neurscope-codex = "benchmark.codex_isolated_run:main"

[tool.setuptools]
py-modules = ["observation_mcp"]

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.setuptools.package-data]
benchmark = ["prompts/*.md"]
